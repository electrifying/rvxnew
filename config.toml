enable-magisk-update = true   # set this to false if you do not want to receive updates for the module in magisk app
parallel-jobs = 1

cli-source = "MorpheApp/morphe-cli"
cli-version = "dev"

[YouTube-Extended]
app-name = "YouTube"
rv-brand = "ReVanced Extended"
build-mode = "module"
# version = "20.31.42"
patches-source = "anddea/revanced-patches"
patches-version = "dev"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"
uptodown-dlurl = "https://youtube.en.uptodown.com/android"
archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.google.android.youtube"
# archive-dlurl = "https://archive.org/download/crimsonman/apk/com.google.android.youtube"
excluded-patches = "'Downloads' 'Return YouTube Dislike' 'Spoof app version' 'Spoof watch history' 'Alternative thumbnails' 'GmsCore support' 'Disable QUIC protocol' 'Return YouTube Username' 'Set Transcript Cookies' 'Change form factor' 'Disable layout updates' 'Enable debug logging' 'Hook download actions' 'Custom branding name for YouTube'"
patcher-args = "-e 'Custom branding icon for YouTube' -OappIcon='revancify_red'"
